services:
  db:
    image: postgres:17-alpine
    container_name: rental_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
      POSTGRES_DB: rental_dev
    ports:
      - "5433:5432"
    volumes:
      - rental_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d rental_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rental_pgdata:
